name: PR Review Reminder

on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch open PRs and notify Mattermost
        uses: actions/github-script@v7
        env:
          MATTERMOST_WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK }}
        with:
          script: |
            const repos = [
              { owner: "DIRACGrid", name: "diracx" },
              { owner: "DIRACGrid", name: "diracx-charts" },
              { owner: "DIRACGrid", name: "diracx-web" },
              { owner: "DIRACGrid", name: "mkdocs-diracx-plugin" },
            ];

            // Build a single GraphQL query with aliases for all repos
            const repoFragments = repos.map((r, i) =>
              `repo${i}: repository(owner: "${r.owner}", name: "${r.name}") {
                nameWithOwner
                pullRequests(states: OPEN, first: 100) {
                  nodes {
                    number
                    title
                    url
                    isDraft
                    createdAt
                    author { login }
                    latestOpinionatedReviews(first: 20, writersOnly: true) {
                      nodes { state submittedAt author { login } }
                    }
                    timelineItems(last: 1, itemTypes: [READY_FOR_REVIEW_EVENT]) {
                      nodes { ... on ReadyForReviewEvent { createdAt } }
                    }
                    reviewRequests(first: 20) {
                      totalCount
                      nodes {
                        requestedReviewer {
                          ... on User { login }
                          ... on Team { name }
                        }
                      }
                    }
                  }
                }
              }`
            ).join("\n");

            const query = `query { ${repoFragments} }`;
            const result = await github.graphql(query);

            // Process results
            // Each reviewer's latest decisive review. A "changes requested"
            // review stays open until its reviewer is asked again: the author
            // re-requests a review from them (GitHub lists them in
            // reviewRequests again until they review or the request is
            // removed), or marks the PR as ready for review after it.
            const requestedLogins = pr => new Set(
              pr.reviewRequests.nodes.map(r => r.requestedReviewer?.login).filter(Boolean)
            );
            const reviewState = pr => {
              const requested = requestedLogins(pr);
              const readyAt = pr.timelineItems.nodes[0]?.createdAt;
              let open = 0, reRequested = 0, approved = 0;
              for (const r of pr.latestOpinionatedReviews.nodes) {
                if (r.state === "APPROVED") approved++;
                if (r.state !== "CHANGES_REQUESTED") continue;
                const askedAgain =
                  requested.has(r.author?.login) ||
                  (readyAt && new Date(readyAt) > new Date(r.submittedAt));
                if (askedAgain) reRequested++; else open++;
              }
              return { open, reRequested, approved };
            };

            const sections = [];
            let totalPRs = 0;

            for (let i = 0; i < repos.length; i++) {
              const data = result[`repo${i}`];
              const prs = data.pullRequests.nodes
                .map(pr => ({ ...pr, state: reviewState(pr) }))
                .filter(pr => !pr.isDraft && pr.state.open === 0);
              if (prs.length === 0) continue;
              totalPRs += prs.length;

              const rows = prs.map(pr => {
                const age = Math.floor(
                  (Date.now() - new Date(pr.createdAt).getTime()) / 86400000
                );
                const author = pr.author ? pr.author.login : "ghost";

                // Determine review status
                let status;
                if (pr.state.reRequested > 0) {
                  status = ":repeat: Re-review requested";
                } else if (pr.state.approved > 0) {
                  status = ":white_check_mark: Approved";
                } else if (pr.reviewRequests.totalCount > 0) {
                  status = ":eyes: Review requested";
                } else {
                  status = ":hourglass: Awaiting review";
                }

                const reviewers = pr.reviewRequests.nodes
                  .map(r => r.requestedReviewer?.login || r.requestedReviewer?.name || "")
                  .filter(Boolean)
                  .join(", ") || "-";

                return `| [#${pr.number}](${pr.url}) | ${pr.title} | ${author} | ${reviewers} | ${age}d | ${status} |`;
              });

              sections.push(
                `#### ${data.nameWithOwner}\n` +
                "| PR | Title | Author | Reviewer | Age | Status |\n" +
                "|:---|:------|:-------|:---------|:----|:-------|\n" +
                rows.join("\n")
              );
            }

            if (totalPRs === 0) {
              core.info("No PRs awaiting review across any repos. Skipping notification.");
              return;
            }

            const message = `### :mag: Open PR Review Summary\n\n${sections.join("\n\n")}`;

            const webhookUrl = process.env.MATTERMOST_WEBHOOK;
            if (!webhookUrl) {
              core.setFailed("MATTERMOST_WEBHOOK secret is not set");
              return;
            }

            const response = await fetch(webhookUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text: message }),
            });

            if (!response.ok) {
              core.setFailed(`Mattermost webhook failed: ${response.status} ${response.statusText}`);
            } else {
              core.info(`Posted summary of ${totalPRs} open PRs to Mattermost`);
            }
